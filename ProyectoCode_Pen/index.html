<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consciencia y Psique</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- encabezado de la page -->
    <header>
        <h1>Consciencia <span>&</span> Psique</h1>
        <p class="intro">Dos sendas para comprender nuestro interior</p>
    </header>
    <main class="profiles">
        <figure class="snip0056 espiritual"> <!-- clase para el estilo de la figura (así venía en el codepen) -->
            <figcaption>
                <h2>El camino <span>interior</span></h2>
                <p>Explora la consciencia, el silencio y el sentido de nuestra existencia.</p>
                <div class="icons">
                    <a href="#" aria-label="naturaleza">☼</a>
                    <a href="#" aria-label="meditación">☯</a>
                    <a href="#" aria-label="espiritualidad">♠</a>
                </div>
            </figcaption>

            <img src="https://images.unsplash.com/photo-1506126613408-eca07ce68773?w=500"
                 alt="chika sentada en contemplación">

            <div class="position">ESPIRITUALIDAD</div>
        </figure>

        <figure class="snip0056 mental">
            <figcaption>
                <h2>La mente <span>humana</span></h2>
                <p>Comprende los pensamientos, las emociones y el autoconocimiento.</p>
                <div class="icons">
                <a href="#" aria-label="pensamiento">♡</a>
                <a href="#" aria-label="emociones">☼</a>      
                    <a href="#" aria-label="mente">♦</a>
                </div>
            </figcaption>

            <img src="https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?w=500"
                 alt="amasijo de flores">

            <div class="position">PSICOLOGÍA</div>
        </figure>
    </main>
</body>
</html>
